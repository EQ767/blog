<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Reader</title>
    <style>
        :root {
            --primary-color: #3498db;
            --text-color: #2c3e50;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --border-radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .profile {
            text-align: center;
            margin-bottom: 30px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 4px solid #f0f0f0;
            transition: all 0.3s ease;
            object-fit: cover;
        }

        .profile img:hover {
            transform: scale(1.05);
            border-color: var(--primary-color);
        }

        .profile h1 {
            font-size: 1.8rem;
            margin: 10px 0;
            color: var(--text-color);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .stats {
            display: inline-flex;
            gap: 15px;
            background-color: #f8f9fa;
            padding: 8px 20px;
            border-radius: 25px;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .entry {
            background-color: var(--card-bg);
            margin-bottom: 20px;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .entry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }

        .entry h2 {
            margin: 0 0 15px 0;
            font-size: 1.3rem;
            color: var(--text-color);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .entry-content {
            margin: 15px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 12px;
            font-size: 1rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
        }

        .entry-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px 0;
            object-fit: contain;
        }

        .entry-time {
            color: #666;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .entry-time::before {
            content: "🕒";
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #2980b9;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .profile, .entry {
                padding: 15px;
                margin-bottom: 15px;
            }
            
            .profile img {
                width: 100px;
                height: 100px;
            }
            
            .stats {
                flex-direction: column;
                gap: 8px;
                padding: 12px;
                width: fit-content;
                margin: 15px auto;
            }
            
            .entry h2 {
                font-size: 1.1rem;
            }
            
            .entry-content {
                padding: 12px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div id="content">
        <div class="loading">加载中...</div>
    </div>

    <script>
        async function fetchFeed() {
            try {
                const CORS_PROXY = "https://api.allorigins.win/raw?url=";
                const FEED_URL = "https://paopaoshequ.com/@ericQ.atom";
                const response = await fetch(CORS_PROXY + encodeURIComponent(FEED_URL));
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const text = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, "text/xml");
                
                if (xmlDoc.getElementsByTagName("parsererror").length > 0) {
                    throw new Error("XML parsing failed");
                }

                const title = xmlDoc.querySelector('title')?.textContent || 'Untitled';
                const subtitle = xmlDoc.querySelector('subtitle')?.textContent || '';
                const logo = xmlDoc.querySelector('logo')?.textContent || '';
                
                const stats = subtitle.match(/(\d+) Notes, (\d+) Following, (\d+) Followers/);
                const statsHtml = stats ? `
                    <div class="stats">
                        <span class="stat-item">📝 ${stats[1]} 笔记</span>
                        <span class="stat-item">👤 ${stats[2]} 关注</span>
                        <span class="stat-item">👥 ${stats[3]} 粉丝</span>
                    </div>
                ` : '';

                const nameMatch = title.match(/(.*?) $@.*?$/);
                const userName = nameMatch ? nameMatch[1] : title;
                
                let html = `
                    <div class="profile">
                        <img src="${logo}" alt="${userName}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ddd%22/></svg>'">
                        <h1>${userName}</h1>
                        ${statsHtml}
                    </div>
                `;
                
                const entries = xmlDoc.querySelectorAll('entry');
                if (entries.length === 0) {
                    html += '<div class="entry">暂无文章</div>';
                } else {
                    entries.forEach(entry => {
                        const entryTitle = entry.querySelector('title')?.textContent || '无标题';
                        const entryLink = entry.querySelector('link')?.getAttribute('href') || '#';
                        const entryUpdated = entry.querySelector('updated')?.textContent;
                        const entryContent = entry.querySelector('content')?.textContent || '';
                        
                        let formattedDate = '未知时间';
                        if (entryUpdated) {
                            try {
                                const date = new Date(entryUpdated);
                                formattedDate = date.toLocaleString('zh-CN', {
                                    timeZone: 'Asia/Shanghai',
                                    year: 'numeric',
                                    month: '2-digit',
                                    day: '2-digit',
                                    hour: '2-digit',
                                    minute: '2-digit',
                                    second: '2-digit',
                                    hour12: false
                                }).replace(/\//g, '-');
                            } catch (e) {
                                console.error('Date parsing error:', e);
                            }
                        }
                        
                        html += `
                            <div class="entry">
                                <h2><a href="${entryLink}" target="_blank">${entryTitle}</a></h2>
                                ${entryContent ? `<div class="entry-content">${entryContent}</div>` : ''}
                                <div class="entry-time">${formattedDate}</div>
                            </div>
                        `;
                    });
                }
                
                document.getElementById('content').innerHTML = html;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error" style="text-align: center; padding: 20px; color: #721c24; background-color: #f8d7da; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.05);">
                        <h3>加载失败</h3>
                        <p>${error.message}</p>
                        <button onclick="fetchFeed()" style="margin-top: 10px; padding: 8px 20px; border-radius: 20px; border: none; background-color: #dc3545; color: white; cursor: pointer; transition: background-color 0.2s;">重试</button>
                    </div>
                `;
            }
        }

        fetchFeed();
    </script>
</body>
</html>
